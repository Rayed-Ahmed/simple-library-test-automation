services:
  web:
    build: .
    container_name: library-web
    ports:
      - "8080:80"
    volumes:
      - ./simple-online-library-system:/var/www/html/simple-online-library-system
    environment:
      DB_SERVER: db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      DB_NAME: library_system_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: library-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: library_system_db
    ports:
      - "3307:3306"
    volumes:
      - library_db_data:/var/lib/mysql
      - ./simple-online-library-system/l_db.sql:/docker-entrypoint-initdb.d/01-library.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  library_db_data:
